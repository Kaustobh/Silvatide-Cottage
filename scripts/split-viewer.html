<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Layer Split Verification</title>
  <style>
    body { margin: 0; background: #16181b; overflow: hidden; font-family: monospace; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    #info { position: absolute; top: 16px; left: 16px; color: #e4e7eb; background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 6px; font-size: 13px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/",
        "meshoptimizer": "/node_modules/meshoptimizer/meshopt_decoder.mjs"
      }
    }
  </script>
</head>
<body>
  <div id="info">SILVATIDE COTTAGE — LAYER SPLIT VERIFICATION</div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'meshoptimizer';

    window.isReady = false;

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x16181b);

    const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0.9, 0.5, 1.0);

    const ambientLight = new THREE.AmbientLight(0xfff5ea, 1.2);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffeedd, 2.4);
    dirLight1.position.set(3, 5, 2);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xaaccff, 1.0);
    dirLight2.position.set(-3, 2, -3);
    scene.add(dirLight2);

    let layersData = null;
    let modelScene = null;
    const layerNodes = new Map();

    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);

    const [gltf, layersJson] = await Promise.all([
      loader.loadAsync('/models/cottage.glb'),
      fetch('/models/layers.json').then(r => r.json())
    ]);

    layersData = layersJson.layers;
    modelScene = gltf.scene;

    // Collect layer nodes
    modelScene.traverse(child => {
      if (child.isNode || child.isMesh || child.name.startsWith('layer_')) {
        layerNodes.set(child.name, child);
      }
    });

    scene.add(modelScene);

    // Center scene bounding box
    const box = new THREE.Box3().setFromObject(modelScene);
    const center = box.getCenter(new THREE.Vector3());
    modelScene.position.sub(center);
    camera.lookAt(0, 0, 0);

    function applyExplode(t) {
      // t = 1 (exploded), t = 0 (assembled)
      for (const l of layersData) {
        const node = layerNodes.get(l.name);
        if (node) {
          // assembledY is the offset needed to touch adjacent layer
          const targetY = (1 - t) * l.assembledY;
          node.position.y = targetY;
        }
      }
      renderer.render(scene, camera);
    }

    window.setExploded = (val) => {
      camera.position.set(0.9, 0.5, 1.0);
      camera.lookAt(0, 0, 0);
      applyExplode(val);
      document.getElementById('info').textContent = val === 1 ? 'MODE: EXPLODED (6 SEPARATED LAYERS)' : 'MODE: ASSEMBLED (ZERO GAPS)';
    };

    window.setSideView = () => {
      camera.position.set(1.3, 0.05, 0);
      camera.lookAt(0, 0, 0);
      applyExplode(0);
      document.getElementById('info').textContent = 'MODE: SIDE PROFILE (ASSEMBLED FIT)';
    };

    // Initial render
    applyExplode(1);
    window.isReady = true;
    console.log('Verification scene ready!');
  </script>
</body>
</html>
