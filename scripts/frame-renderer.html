<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #f6f4ee; overflow: hidden; }
    #canvas { width: 1280px; height: 720px; display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/",
        "meshoptimizer": "/node_modules/meshoptimizer/meshopt_decoder.mjs"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas" width="1280" height="720"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'meshoptimizer';

    window.isReady = false;

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1280, 720);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf6f4ee);

    // Front elevation camera framing matching Photo 7
    const camera = new THREE.PerspectiveCamera(40, 1280 / 720, 0.05, 50);
    // Broad elevation view: cottage is centered along X/Z
    camera.position.set(0.72, 0.02, 0.0);
    camera.lookAt(0, -0.03, 0);

    // High-end Lighting
    const hemiLight = new THREE.HemisphereLight(0xfff8ee, 0x222630, 1.4);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xffeedd, 2.6);
    sun.position.set(4, 6, 3);
    scene.add(sun);

    const skyFill = new THREE.DirectionalLight(0x88aacc, 1.0);
    skyFill.position.set(-4, 3, -3);
    scene.add(skyFill);

    // Architectural Contour Shader (Ink on paper)
    const contourVertexShader = `
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const contourFragmentShader = `
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      uniform vec3 inkColor;
      uniform vec3 paperColor;
      uniform float shadeFactor;

      void main() {
        vec3 normal = normalize(vNormal);
        vec3 viewDir = normalize(vViewPosition);
        float NdotV = abs(dot(normal, viewDir));
        float rim = 1.0 - NdotV;
        
        // Clean contour edges
        float edge = smoothstep(0.48, 0.78, rim);
        
        // Soft volumetric hatch/depth
        float depthShade = (1.0 - NdotV) * shadeFactor * 0.45;
        
        vec3 base = mix(paperColor, inkColor * 1.5, depthShade);
        vec3 finalColor = mix(base, inkColor, edge * 0.95);
        
        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    const contourUniforms = {
      inkColor: { value: new THREE.Color(0x111317) },
      paperColor: { value: new THREE.Color(0xf6f4ee) },
      shadeFactor: { value: 0.0 }
    };

    const contourMaterial = new THREE.ShaderMaterial({
      vertexShader: contourVertexShader,
      fragmentShader: contourFragmentShader,
      uniforms: contourUniforms,
      side: THREE.DoubleSide
    });

    // Load split layers model & layer metadata
    const [layersData, gltf] = await Promise.all([
      fetch('/models/layers.json').then(r => r.json()),
      (async () => {
        const loader = new GLTFLoader();
        loader.setMeshoptDecoder(MeshoptDecoder);
        return loader.loadAsync('/models/cottage-split-layers.glb');
      })()
    ]);

    const model = gltf.scene;

    // Center model
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    scene.add(model);

    // Map layer nodes and original materials
    const layerOffsets = {};
    for (const l of layersData.layers) {
      layerOffsets[l.name] = l.assembledY || 0;
    }

    const layerNodes = {};
    const originalMaterials = new Map();

    model.traverse(child => {
      if (child.isMesh) {
        originalMaterials.set(child, child.material);
      }
      if (child.name && layerOffsets[child.name] !== undefined) {
        layerNodes[child.name] = child;
      }
    });

    console.log('Layer nodes loaded:', Object.keys(layerNodes));

    // Render frame function
    window.renderFrame = (progress) => {
      // Progress [0.0 .. 1.0]
      // 1. Physical layer assembly animation
      // When progress = 0: exploded stack
      // When progress >= 0.75: fully assembled
      const assemblyProgress = Math.min(1.0, progress / 0.75);
      const easeAssembly = 1 - Math.pow(1 - assemblyProgress, 3); // cubic out

      // Move each layer from exploded position to assembled position
      for (const [name, node] of Object.entries(layerNodes)) {
        const assembledY = layerOffsets[name] || 0;
        // At progress 0, offset = 0 (native exploded position in CAD)
        // At progress 1, offset = assembledY (touching adjacent layers)
        node.position.y = (1 - easeAssembly) * 0 + easeAssembly * assembledY;
      }

      // 2. Material & Background Transitions:
      // Phase A: 0.00 <= progress < 0.35 -> Pure ink contour on warm paper
      // Phase B: 0.35 <= progress < 0.65 -> Tone shading fills in, background blends to dark
      // Phase C: 0.65 <= progress <= 1.00 -> Textures & lighting materialize into full reality

      const paperBg = new THREE.Color(0xf6f4ee);
      const darkBg = new THREE.Color(0x0c0e12);

      if (progress < 0.35) {
        const pA = progress / 0.35;
        scene.background.copy(paperBg);
        contourUniforms.shadeFactor.value = pA * 0.5;
        contourUniforms.paperColor.value.copy(paperBg);
        contourUniforms.inkColor.value.setHex(0x111317);

        model.traverse(child => {
          if (child.isMesh) child.material = contourMaterial;
        });
      } else if (progress < 0.65) {
        const pB = (progress - 0.35) / 0.30;
        // Blend background from paper to deep dark
        scene.background.lerpColors(paperBg, darkBg, pB);
        
        contourUniforms.shadeFactor.value = 0.5 + pB * 0.5;
        // Tone ink and paper for inverted dark mode contrast
        const currentPaper = new THREE.Color().lerpColors(paperBg, new THREE.Color(0x161a22), pB);
        const currentInk = new THREE.Color().lerpColors(new THREE.Color(0x111317), new THREE.Color(0xdce2ec), pB);
        contourUniforms.paperColor.value.copy(currentPaper);
        contourUniforms.inkColor.value.copy(currentInk);

        model.traverse(child => {
          if (child.isMesh) child.material = contourMaterial;
        });
      } else {
        const pC = (progress - 0.65) / 0.35;
        scene.background.copy(darkBg);

        model.traverse(child => {
          if (child.isMesh) {
            const orig = originalMaterials.get(child);
            if (orig) {
              child.material = orig;
              orig.roughness = 0.7;
              orig.metalness = 0.1;
            }
          }
        });

        // Enhance direct sun as it completes
        sun.intensity = 2.0 + pC * 0.8;
      }

      // Camera gently tracks from slight diagonal into straight elevation
      camera.position.x = 0.76 - progress * 0.04;
      camera.position.y = 0.04 - progress * 0.02;
      camera.lookAt(0, -0.02, 0);

      renderer.render(scene, camera);
      return canvas.toDataURL('image/jpeg', 0.95);
    };

    window.renderFrame(0);
    window.isReady = true;
    console.log('Frame renderer ready');
  </script>
</body>
</html>
